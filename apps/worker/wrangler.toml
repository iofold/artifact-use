name = "artifact-use"
main = "src/index.ts"
compatibility_date = "2026-06-01"
# iofold Cloudflare account. This matches the account used for the existing
# legacy-artifacts bucket/deploy flow; override with CLOUDFLARE_ACCOUNT_ID if needed.
account_id = "00000000000000000000000000000000"

# Keep the existing legacy artifact host `legacy-artifacts` Worker as the custom-domain
# origin for legacy direct artifact links. This Worker only handles the new
# Artifact Use homepage, API/MCP/admin paths, and new public artifact links
# under /go/. Legacy direct artifact links stay on the legacy artifact host Worker.
[[routes]]
pattern = "artifacts.iofold.com/"
zone_name = "iofold.com"

[[routes]]
pattern = "artifacts.iofold.com/go"
zone_name = "iofold.com"

[[routes]]
pattern = "artifacts.iofold.com/go/*"
zone_name = "iofold.com"

[[routes]]
pattern = "artifacts.iofold.com/mcp*"
zone_name = "iofold.com"

[[routes]]
pattern = "artifacts.iofold.com/api/v1*"
zone_name = "iofold.com"

[[routes]]
pattern = "artifacts.iofold.com/_au*"
zone_name = "iofold.com"

[[routes]]
pattern = "artifacts.iofold.com/.well-known/oauth-*"
zone_name = "iofold.com"

[[routes]]
pattern = "artifacts.iofold.com/llms.txt"
zone_name = "iofold.com"

[[routes]]
pattern = "artifacts.iofold.com/llms-full.txt"
zone_name = "iofold.com"

[[routes]]
pattern = "artifacts.iofold.com/login*"
zone_name = "iofold.com"

[[routes]]
pattern = "artifacts.iofold.com/signin*"
zone_name = "iofold.com"

[[routes]]
pattern = "artifacts.iofold.com/signup*"
zone_name = "iofold.com"

[[routes]]
pattern = "artifacts.iofold.com/invite*"
zone_name = "iofold.com"

[[routes]]
pattern = "artifacts.iofold.com/callback*"
zone_name = "iofold.com"

[[routes]]
pattern = "artifacts.iofold.com/logout*"
zone_name = "iofold.com"

[[routes]]
pattern = "artifacts.iofold.com/admin*"
zone_name = "iofold.com"

[[routes]]
pattern = "artifacts.iofold.com/health*"
zone_name = "iofold.com"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "artifact-use"

[[d1_databases]]
binding = "DB"
database_name = "artifact-use"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
SITE_BASE_URL = "https://artifacts.iofold.com"
ARTIFACT_PUBLIC_PATH_PREFIX = "/go"
WORKOS_AUTHKIT_URL = "https://your-authkit-domain.example"
WORKOS_AUDIENCE = "https://artifacts.iofold.com/mcp"
WORKOS_ISSUER = "https://your-authkit-domain.example"
WORKOS_JWKS_URL = "https://your-authkit-domain.example/oauth2/jwks"
ARTIFACT_USE_AUTH_SCOPES = "openid profile email offline_access"
ARTIFACT_USE_READ_SCOPES = "openid"
ARTIFACT_USE_WRITE_SCOPES = "openid"
MAIL_FROM = "artifacts@example.com"
MAIL_FROM_NAME = "Artifact Use"
DEFAULT_PACKAGE_LIMIT_BYTES = "99614720"
DEFAULT_FILE_LIMIT_BYTES = "78643200"
DEFAULT_FILE_COUNT_LIMIT = "200"
HTTP_MCP_INLINE_FILE_LIMIT_BYTES = "2097152"
ALLOW_DEBUG_CODES = "false"
ARTIFACT_USE_SUPER_ADMIN_USER_IDS = "user_example"

# Secrets:
#   SESSION_SECRET
#   RESEND_API_KEY
#   DEV_AUTH_TOKEN        optional local development escape hatch
