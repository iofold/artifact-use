name = "artifact-use"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# Regenerate the injected feedback widget (src/widget/feedback.js ->
# feedback.generated.ts) before bundling, on both `wrangler dev` and deploy.
[build]
command = "node scripts/build-feedback-widget.mjs"

# Replace with your Cloudflare account id or set CLOUDFLARE_ACCOUNT_ID in the
# shell that runs Wrangler.
account_id = "00000000000000000000000000000000"

# Replace these routes with your own zone/domain before deploying.
[[routes]]
pattern = "artifacts.example.com/"
zone_name = "example.com"

[[routes]]
pattern = "artifacts.example.com/go*"
zone_name = "example.com"

[[routes]]
pattern = "artifacts.example.com/mcp*"
zone_name = "example.com"

[[routes]]
pattern = "artifacts.example.com/api/v1*"
zone_name = "example.com"

[[routes]]
pattern = "artifacts.example.com/_au*"
zone_name = "example.com"

[[routes]]
pattern = "artifacts.example.com/.well-known/oauth-*"
zone_name = "example.com"

[[routes]]
pattern = "artifacts.example.com/llms.txt"
zone_name = "example.com"

[[routes]]
pattern = "artifacts.example.com/llms-full.txt"
zone_name = "example.com"

[[routes]]
pattern = "artifacts.example.com/login*"
zone_name = "example.com"

[[routes]]
pattern = "artifacts.example.com/signin*"
zone_name = "example.com"

[[routes]]
pattern = "artifacts.example.com/signup*"
zone_name = "example.com"

[[routes]]
pattern = "artifacts.example.com/invite*"
zone_name = "example.com"

[[routes]]
pattern = "artifacts.example.com/callback*"
zone_name = "example.com"

[[routes]]
pattern = "artifacts.example.com/logout*"
zone_name = "example.com"

[[routes]]
pattern = "artifacts.example.com/admin*"
zone_name = "example.com"

[[routes]]
pattern = "artifacts.example.com/health*"
zone_name = "example.com"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "artifact-use"

[[d1_databases]]
binding = "DB"
database_name = "artifact-use"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
SITE_BASE_URL = "https://artifacts.example.com"
ARTIFACT_PUBLIC_PATH_PREFIX = "/go"
WORKOS_AUTHKIT_URL = "https://your-authkit-domain.example"
WORKOS_AUDIENCE = "https://artifacts.example.com/mcp"
WORKOS_ISSUER = "https://your-authkit-domain.example"
WORKOS_JWKS_URL = "https://your-authkit-domain.example/oauth2/jwks"
ARTIFACT_USE_AUTH_SCOPES = "openid profile email offline_access"
ARTIFACT_USE_READ_SCOPES = "openid"
ARTIFACT_USE_WRITE_SCOPES = "openid"
MAIL_FROM = "artifacts@example.com"
MAIL_FROM_NAME = "Artifact Use"
DEFAULT_PACKAGE_LIMIT_BYTES = "99614720"
DEFAULT_FILE_LIMIT_BYTES = "78643200"
DEFAULT_FILE_COUNT_LIMIT = "200"
HTTP_MCP_INLINE_FILE_LIMIT_BYTES = "2097152"
ALLOW_DEBUG_CODES = "false"
ARTIFACT_USE_SUPER_ADMIN_USER_IDS = ""

# Secrets:
#   SESSION_SECRET
#   RESEND_API_KEY       optional unless using verified_email gates
#   WORKOS_CLIENT_ID     required for publisher web auth
#   WORKOS_API_KEY       required for publisher web auth and team invites
#   DEV_AUTH_TOKEN       optional local development escape hatch
